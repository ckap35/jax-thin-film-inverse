[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thin-film-inverse"
version = "0.1.0"
description = "A JAX thin-film reflectance model and thickness-recovery example"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.28",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
thin-film-inverse = "thin_film_inverse.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
